name: teslaapp
options:
  bundleIdPrefix: com.zhangweiwei
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    STRIP_INSTALLED_PRODUCT: NO
    COPY_PHASE_STRIP: NO
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
targets:
  teslaapp:
    type: application
    platform: iOS
    sources:
      - path: teslaapp
    dependencies:
      - framework: Frameworks/TeslaBLE.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangweiwei.teslaapp
        PRODUCT_NAME: Tesla
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Tesla
    info:
      path: teslaapp/Info.plist
      properties:
        CFBundleDisplayName: Tesla
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: 需要蓝牙连接车辆，用作手机钥匙（解锁、启动）
        NSBluetoothPeripheralUsageDescription: 需要蓝牙连接车辆，用作手机钥匙
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
